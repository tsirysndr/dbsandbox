name: Publish tags to FlakeHub

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        type: string
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: flakehub-publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'tsirysndr/dbsandbox'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PUBLISH_TAG: ${{ inputs.tag || github.ref_name }}
      NIX_CONFIG: |
        access-tokens = github.com=${{ github.token }}
        accept-flake-config = true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: fluentci-io/setup-fluentci@next
        with:
          version: v0.17.8
      - name: Set up Determinate Nix
        shell: bash
        run: |
          set -euo pipefail
          fluentci --check-update=false run --frozen-lockfile setup-determinate-nix@0.2.2 setup --sudo --trusted-users "$(id -un)" \
            | node .fluentci/github-env.mjs
      - name: Set up FlakeHub Push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          curl_home=$(mktemp -d "$RUNNER_TEMP/flakehub-curl.XXXXXXXX")
          trap 'rm -rf "$curl_home"' EXIT
          printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" > "$curl_home/.curlrc"
          CURL_HOME="$curl_home" fluentci --check-update=false run --frozen-lockfile setup-flakehub-push@0.2.0 setup \
            | node .fluentci/github-env.mjs
      - name: Publish to FlakeHub
        shell: bash
        env:
          FLAKEHUB_PUSH_GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$PUBLISH_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          export FLAKEHUB_PUSH_REV
          FLAKEHUB_PUSH_REV=$(git rev-parse HEAD)
          fluentci --check-update=false run --frozen-lockfile nix-publish@0.2.0 flakehub \
            --run-dir "$RUNNER_TEMP/flakehub-$GITHUB_RUN_ATTEMPT" \
            --name tsirysndr/dbsandbox --version "$PUBLISH_TAG" --visibility public --timeout-ms 2400000
