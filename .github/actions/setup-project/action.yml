name: Set up and build dbsandbox
description: Install pinned Rust and PureScript toolchains with FluentCI, then build the native module and checkout.
runs:
  using: composite
  steps:
    - uses: fluentci-io/setup-fluentci@next
      with:
        version: v0.17.8
    - name: Install PureScript runtime libraries
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo -n apt-get update
        sudo -n apt-get install -y --no-install-recommends libgmp10 libtinfo6
    - name: Cache package downloads
      uses: actions/cache@v4
      with:
        path: |
          ~/.bun/install/cache
          ~/.cache/spago-nodejs
          .spago
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: dbsandbox-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'bun.lock', 'spago.lock', '.fluentci/test/bun.lock', '.fluentci/test/spago.lock') }}
        restore-keys: dbsandbox-${{ runner.os }}-${{ runner.arch }}-
    - name: Set up Rust with FluentCI
      shell: bash
      run: |
        set -o pipefail
        fluentci --check-update=false run --frozen-lockfile setup-rust@0.2.2 setup \
          --toolchain 1.100.0 --components rustfmt,clippy --profile minimal \
          | node .fluentci/github-env.mjs
    - name: Set up PureScript, Spago, Node and Bun with FluentCI
      shell: bash
      run: |
        mkdir -p .fluentci
        fluentci --check-update=false run --frozen-lockfile setup-purescript@v0.2.0 setup \
          --version 0.15.16 --spago-version 1.0.5 \
          --node-version 24.22.2 --bun-version 1.4.5 > .fluentci/setup.json
    - name: Build the release native module before Bun lifecycle builds
      shell: bash
      run: node scripts/build-cluster.mjs
    - name: Build PureScript CI code and export the toolchain environment
      shell: bash
      env:
        BSDKRUN_NO_AUTO_INSTALL: '1'
      run: node bin/bootstrap-ci.mjs .fluentci/setup.json
